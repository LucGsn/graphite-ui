name: Release

# Deux déclencheurs :
# - un tag vX.Y.Z poussé crée la release ;
# - un lancement manuel (onglet Actions → Release → Run workflow) crée le tag ET la release
#   à partir de la branche choisie.
# Dans les deux cas, la release contient le skill Claude prêt à importer dans claude.ai.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 0.3.0 ou v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Déterminer le tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="v${INPUT_VERSION#v}"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "Version invalide : $TAG" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Archive du skill (dossier graphite-ui/ à la racine du zip)
        run: |
          cd skills
          zip -r "../graphite-ui-skill-${TAG}.zip" graphite-ui
      - name: Créer le tag et la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --target n'est utilisé que si le tag n'existe pas encore (lancement manuel).
          gh release create "$TAG" "graphite-ui-skill-${TAG}.zip" \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
