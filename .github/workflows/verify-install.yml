name: Verify install

# Vérifie l'installation du paquet publié (GitHub Packages) dans une app Next.js vierge : installation, build,
# affichage et contrat sans React. Lancement manuel : Actions → Verify install → Run workflow.
# Aucun jeton personnel : le jeton intégré du workflow lit le paquet de ce dépôt.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à vérifier (défaut : celle de package.json)"
        required: false
        type: string

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer depuis GitHub Packages et vérifier
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: node scripts/verify-install.mjs ${INPUT_VERSION#v}
